general {
    after_sleep_cmd = hyprctl dispatch dpms on
    # Respect systemd-inhibit and dbus (browser video) idle inhibitors.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Screen off after 10 minutes of no input.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 minutes of no input. Lid-closed suspend is handled
# separately (instantly) by logind; see setup-power.sh.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
