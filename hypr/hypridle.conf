general {
    after_sleep_cmd = hyprctl dispatch dpms on
    # Respect systemd-inhibit and dbus (browser video) idle inhibitors.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Screen off after 10 minutes of no input.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 minutes of no input — battery only: on AC (any
# Mains-type supply online) the machine stays awake, screen still blanks
# above. Note: if AC is unplugged mid-idle, suspend waits for the next
# input to restart the timer. Lid-closed suspend is handled separately
# (instantly) by logind regardless of AC; see setup-power.sh.
listener {
    timeout = 1800
    on-timeout = for p in /sys/class/power_supply/*; do [ "$(cat $p/type 2>/dev/null)" = "Mains" ] && [ "$(cat $p/online 2>/dev/null)" = "1" ] && exit 0; done; systemctl suspend
}
