# Pills render in this order.
languages = ["en", "ko", "ja", "ar", "he", "ru"]

# Default frequency window for picks: the top-N most frequent words.
# rarity bands are quarters of the window: most-common (default) |
# less-common | least-common | rarest. All of this is applied at pick
# time — change freely without re-syncing.
frequency_top_n = 5000

# "shared" (default): everyone sees the same words on a given day.
# "machine": unique per machine. Any other string: custom salt.
seed = "shared"

[lang.en]
rarity = "rarest"
frequency_top_n = 50000  # full list; rarest quarter = genuinely new words

[lang.ko]
rarity = "less-common"

[lang.ja]
display = "kana"         # show the ruby reading — no kanji in the pill
spell_out = true

[lang.ar]
display = "vocalized"    # canonical form with vowel diacritics
spell_out = true

[lang.he]
display = "vocalized"    # canonical form with niqqud
spell_out = true

[lang.ru]
spell_out = true
